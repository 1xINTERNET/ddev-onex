#ddev-generated
# User guide preview for "ddev 1x-user-guide serve", at https://<project>.pages.<tld>/<base>/.
# Off by default (compose profile); "ddev 1x-user-guide stop" removes the container again.
services:
  user-guide:
    image: ${GITLAB_PAGES_IMAGE:-git.1xinternet.de:4567/public_group/public_registry/gitlab-pages:latest}
    # The image is amd64 only and runs as root (/site is root-owned), see ddev-onex PR #68.
    platform: linux/amd64
    container_name: ddev-${DDEV_SITENAME}-user-guide
    profiles:
      - user-guide
    command: gitlab-pages serve /project
    expose:
      - 4321
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      VIRTUAL_HOST: ${DDEV_SITENAME}.pages.${DDEV_TLD}
      HTTP_EXPOSE: 80:4321
      HTTPS_EXPOSE: 443:4321
      # Astro's dev server rejects foreign hosts with 403 otherwise.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .${DDEV_TLD}
    volumes:
      - ${DDEV_APPROOT}:/project
